name: Deploy website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/site/**', 'resources/icon.svg', 'scripts/build-site.mjs', 'scripts/verify-site.mjs', 'package.json', 'package-lock.json', '.github/workflows/pages.yml']
  pull_request:
    paths: ['docs/site/**', 'resources/icon.svg', 'scripts/build-site.mjs', 'scripts/verify-site.mjs', 'package.json', 'package-lock.json', '.github/workflows/pages.yml']

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Build and verify
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          npm run site:build
          npm run site:check
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: output/site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
