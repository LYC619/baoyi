name: Bug report / 问题反馈
description: Report a reproducible problem / 提交可复现的问题
body:
  - type: markdown
    attributes:
      value: "Remove keys, account tokens, personal paths and document contents. 请勿上传日常资料库或私人凭据。"
  - type: input
    id: version
    attributes:
      label: App version and Windows version / 程序与系统版本
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Interface language / 界面语言
      options: [English, 简体中文, Follow system / 跟随系统]
  - type: textarea
    id: steps
    attributes:
      label: Steps and expected behavior / 复现步骤与期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result and redacted error / 实际结果与脱敏报错
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Synthetic sample or screenshot / 虚构样例或截图
      description: Describe whether a small independent library reproduces it. 说明独立小资料库能否复现。
