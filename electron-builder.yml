appId: com.baoyi.app
productName: 抱一
copyright: Copyright © 2026 BaoYi

# better-sqlite3 13 ships N-API prebuilds. Validate with verify-native-runtime;
# rebuilding these stable-ABI binaries would unnecessarily require Visual Studio.
npmRebuild: false

directories:
  output: release/${version}
  buildResources: resources

files:
  - dist/**/*
  - dist-electron/**/*
  - resources/agent-skills/**/*
  - package.json
  - docs/third-party/*.txt
  # Pure JS/PDF dependencies are bundled at build time. SQLite source/header
  # files are not needed by the prebuilt N-API runtime.
  - '!node_modules/better-sqlite3/deps/**/*'
  - '!node_modules/better-sqlite3/src/**/*'
  - '!node_modules/node-addon-api/**/*'

asarUnpack:
  - '**/node_modules/better-sqlite3/**'

# 已知存档位置索引（scripts/build-save-manifest.ts 编译出来的，2 MB）。
# 放进 resources 而不是打进 asar：它只在识别游戏时读一次，不该进 JS 包体，
# 而 kinds/game/service.ts 会按 app.isPackaged 决定去哪儿找它。
extraResources:
  - from: output/comic-runtime
    to: comic-runtime
    filter:
      - '**/*'
      - '!**/__pycache__/**/*'
      - '!**/*.pyc'
  - from: resources/comic
    to: comic
    filter:
      - '*.py'
      - '*.lock'
      - '*.in'
  - from: resources/project-runner
    to: project-runner
    filter:
      - '*.py'
  - from: resources/save-manifest.json
    to: save-manifest.json

  # MediaInfoLib 的 WASM（约 4 MB），读视频容器元数据用。
  #
  # 必须显式列在这儿，有两个原因叠在一起：mediainfo.js 是 devDependency，
  # 而 electron-builder 只打包 dependencies；就算它是 dependency，
  # .wasm 也是二进制资产，vite 打不进 dist-electron/main.js 里去。
  #
  # 落点和 kinds/video/mediainfo.ts 里 findWasm() 的第三条候选
  # （process.resourcesPath 下的同名文件）是对死的，改这儿要同时改那儿。
  # 漏了不会报错，只会让打包后的应用读不出时长和音轨 —— 开发时一切正常，
  # 装完之后详情页少半屏，是最容易漏到用户手上的那种。
  - from: node_modules/mediainfo.js/dist/MediaInfoModule.wasm
    to: MediaInfoModule.wasm

  # 归档助理使用的 Hermes 原版运行组件。Python、Hermes 源码和锁定依赖
  # 一并放在 resources，用户无需安装 Python 或运行 npm。
  - from: output/hermes-runtime
    to: hermes-runtime
    filter:
      - '**/*'
      - '!**/__pycache__/**/*'
      - '!**/*.pyc'
  - from: resources/hermes
    to: hermes
    filter:
      - '**/*'
      - '!**/__pycache__/**/*'
      - '!**/*.pyc'

# 应用图标：resources/icon.svg 是矢量源文件，icon.ico / icon.png 由
# `npx electron scripts/make-icons.cjs` 从它生成（Electron 自己的 Chromium 渲染，
# 跟应用里看到的是同一个结果）。改了 svg 就重跑一次，不要手工描图 ——
# 手工描等于维护两份图标，改了一份忘了另一份时没人会发现。
win:
  icon: resources/icon.ico
  target:
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 抱一

mac:
  icon: resources/icon.png
  target: [dmg]
  category: public.app-category.utilities

linux:
  icon: resources/icon.png
  target: [AppImage]
  category: Utility
