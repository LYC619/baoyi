appId: com.baoyi.app
productName: 抱一
copyright: Copyright © 2026 BaoYi

directories:
  output: release/${version}
  buildResources: resources

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

asarUnpack:
  - '**/node_modules/better-sqlite3/**'

# 已知存档位置索引（scripts/build-save-manifest.ts 编译出来的，2 MB）。
# 放进 resources 而不是打进 asar：它只在识别游戏时读一次，不该进 JS 包体，
# 而 kinds/game/service.ts 会按 app.isPackaged 决定去哪儿找它。
extraResources:
  - from: resources/save-manifest.json
    to: save-manifest.json

# 应用图标：resources/icon.svg 是矢量源文件，icon.ico / icon.png 由
# `npx electron scripts/make-icons.cjs` 从它生成（Electron 自己的 Chromium 渲染，
# 跟应用里看到的是同一个结果）。改了 svg 就重跑一次，不要手工描图 ——
# 手工描等于维护两份图标，改了一份忘了另一份时没人会发现。
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 抱一

mac:
  icon: resources/icon.png
  target: [dmg]
  category: public.app-category.utilities

linux:
  icon: resources/icon.png
  target: [AppImage]
  category: Utility
