# 绿色 ZIP 配置：复用便携数据标记，输出到独立的版本目录。
#
# **为什么必须是单独一份配置，而不是往 win.target 里再加一个 zip。**
# 标记文件（`绿色版.txt`）决定运行时把数据写到哪。`extraFiles` 是全局的，
# 一份配置里同时出 nsis 和 zip，标记会**同时进两个产物**。那时装机版的行为变成：
# 装到 `C:\Program Files\` → 目录不可写 → 退回 AppData（对的）；但用户改装到
# `D:\抱一\` → 可写 → 数据落在安装目录旁边。
#
# 后者不算崩，但它是装机版不该有的行为：卸载不会带走数据，而且和「装了的程序
# 数据在 AppData」这个预期不一致。一个开关管两种分发方式，迟早会在某台机器上
# 选错边 —— 所以从源头分开。
extends: ./electron-builder.portable.yml

# 保留历史绿色 ZIP 的应用标识。
appId: com.baoyi.app

directories:
  output: release/${version}-green

win:
  icon: resources/icon.ico
  target:
    - target: zip
      arch: [x64]

# 标记文件沿用 portable 配置，中文和 ASCII 标记一并保留。
